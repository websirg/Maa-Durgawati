    <linearGradient id="pill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Blister Pack Frame -->
  <rect x="50" y="40" width="300" height="160" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
