    <line x1="65" y1="80" x2="90" y2="80" stroke="#94a3b8" stroke-width="2"/>
    
    <circle cx="137.5" cy="80" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="125" y1="80" x2="150" y2="80" stroke="#94a3b8" stroke-width="2"/>
    
    <circle cx="197.5" cy="80" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="185" y1="80" x2="210" y2="80" stroke="#94a3b8" stroke-width="2"/>
