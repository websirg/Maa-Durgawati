    <rect x="180" y="25" width="35" height="25" rx="0 0 17.5 17.5" fill="#a7f3d0"/>
    
    <circle cx="17.5" cy="80" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="5" y1="80" x2="30" y2="80" stroke="#94a3b8" stroke-width="2"/>
    
