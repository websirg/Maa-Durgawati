<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#sbg)"/>
  <!-- Syrup Bottle -->
  <g transform="translate(130, 30)">
    <!-- Cap -->
    <rect x="45" y="0" width="40" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Neck -->
    <rect x="52" y="18" width="26" height="16" fill="#b45309"/>
    <!-- Body -->
    <rect x="25" y="34" width="80" height="135" rx="12" fill="url(#bottleGrad)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.15))"/>
    <!-- Label -->
    <rect x="28" y="65" width="74" height="75" rx="4" fill="#ffffff"/>
    <rect x="38" y="75" width="54" height="8" rx="2" fill="#059669"/>
    <rect x="45" y="88" width="40" height="5" rx="1" fill="#0284c7"/>
    <!-- Cross on label -->
    <path d="M60 102h10v3h-10z M63.5 98.5h3v10h-3z" fill="#ef4444"/>
    <!-- Measuring Spoon -->
    <path d="M125 145 c15 -20 35 -20 50 0 c-5 15 -45 15 -50 0z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <path d="M175 145 l35 15" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Droplet -->
    <circle cx="148" cy="142" r="5" fill="#fbbf24"/>
  </g>
</svg>