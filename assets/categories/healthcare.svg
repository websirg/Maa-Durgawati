<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#hbg)"/>
  <!-- Stethoscope & Heart -->
  <g transform="translate(120, 30)">
    <!-- Heart Background -->
    <path d="M80 35 C65 10 30 10 15 35 C-5 65 35 110 80 135 C125 110 165 65 145 35 C130 10 95 10 80 35 Z" fill="#ffffff" stroke="#14b8a6" stroke-width="3" filter="drop-shadow(0 4px 10px rgba(20,184,166,0.15))"/>
    <!-- Stethoscope Tube -->
    <path d="M50 45 C40 85 45 110 70 120 C95 130 120 110 120 85" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="80" r="10" fill="#e2e8f0" stroke="#0f766e" stroke-width="3"/>
    <!-- Cross in Heart -->
    <path d="M74 55 h12 v10 h10 v12 h-10 v10 h-12 v-10 h-10 v-12 h10 z" fill="#14b8a6"/>
  </g>
</svg>