<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="380" height="75">
  <defs>
    <linearGradient id="logoMedGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="logoBlueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(6, 6)" filter="url(#logoShadow)">
    <!-- Rounded Background Badge -->
    <rect x="0" y="0" width="62" height="62" rx="16" fill="url(#logoMedGreen)" />
    
    <!-- White Pharmacy Cross -->
    <path d="M25 14h12v11h11v12H37v11H25V37H14V25h11V14z" fill="#ffffff" />
    
    <!-- Pulse Line in Subtle Blue -->
    <path d="M17 31h7l3-6 5 12 3-6h8" fill="none" stroke="url(#logoBlueAccent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography (Hindi + English) -->
  <!-- Hindi Name -->
  <text x="80" y="27" font-family="'Hind', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#064e3b" letter-spacing="-0.2">
    माँ दुर्गावती मेडिकल एंड क्लिनिक
  </text>
  
  <!-- English Name -->
  <text x="80" y="46" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0284c7" letter-spacing="0.8">
    MAA DURGAWATI MEDICAL &amp; CLINIC
  </text>

  <!-- Location Tagline -->
  <text x="80" y="62" font-family="'Plus Jakarta Sans', 'Inter', 'Hind', sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="0.3">
    इटैली मोड़, मेहनाजपुर • AZAMGARH, U.P.
  </text>
</svg>
